name: gis_mobile_app
description: "Flutter GIS & Mapbox Cross-Platform Mobile Client Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  flutter_bloc: ^8.1.3
  qr_flutter: ^4.1.0
  otp: ^3.1.5
  crypto: ^3.0.3
  flutter_windowmanager: ^0.2.0
  mobile_scanner: ^5.1.1
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
